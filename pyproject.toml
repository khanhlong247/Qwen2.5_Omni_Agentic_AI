[project]
name = "qwen2-5-audio"
version = "0.1.0"
description = "Insurance AI Agent using Qwen2.5-Omni with Audio Tool-calling"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "transformers>=4.45.0",
    "accelerate",
    "peft",
    "bitsandbytes",
    "librosa",
    "av",
    "audioread",
    "decord",
    "sentencepiece",
    "requests",
    "numpy<2.0.0",
    "pillow",
    "google-generativeai>=0.8.3",
    "python-dotenv>=1.0.1",
    "mysql-connector-python>=9.7.0",
    "sqlalchemy>=2.0.49",
    "agno>=2.6.5",
    "gradio>=6.14.0",
    "scipy>=1.15.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
